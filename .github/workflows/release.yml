name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Plugin end-to-end test
        if: runner.os == 'Linux'
        run: python3 plugin/tests/test_sync.py
      - name: AI agent end-to-end test
        if: runner.os == 'Linux'
        run: python3 agent/tests/test_agent.py
      - name: Installer lint
        if: runner.os == 'Linux'
        run: shellcheck -S warning installer/linux/install.sh scripts/*.sh agent/collab-agent
      - name: Installer parse check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/windows/install.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }

  bundle:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04   # older glibc: the binary runs on most distros
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/dist.sh ${{ matrix.platform }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
